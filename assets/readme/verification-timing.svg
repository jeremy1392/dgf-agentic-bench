<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">When is the agent checked?</title><desc id="desc">When is the agent checked?</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#627f90" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="1398" height="818" rx="12" fill="#fcfdfd" stroke="#d5dfe6"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="43" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="2">DGF-BENCH / CHECKS AND TIMING</text>
<text x="48" y="89" font-size="32" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">When is the agent checked?</text>
<text x="48" y="128" font-size="21" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Two distinct checks: tool actions during a review, then results after the dossier’s route.</text>
<rect x="48" y="172" width="636" height="314" rx="9" fill="#f1f6f9" stroke="#c9d9e3"/>
<text x="72" y="205" font-size="14" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">01 / DURING EACH GATE</text>
<text x="72" y="248" font-size="26" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">The tool checks the request</text>
<text x="72" y="294" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Example: request a conditional approval.</text>
<text x="72" y="326" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Does the mandate cover this gate and phase?</text>
<text x="72" y="358" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Are all open findings covered and eligible?</text>
<text x="72" y="390" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Are nonempty conditions supplied?</text>
<rect x="716" y="172" width="636" height="314" rx="9" fill="#f1f6f9" stroke="#c9d9e3"/>
<text x="740" y="205" font-size="14" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">02 / AFTER THE DOSSIER’S ROUTE</text>
<text x="740" y="248" font-size="26" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">The scorer evaluates every gate</text>
<text x="740" y="294" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">A Python program compares the output to the reference.</text>
<text x="740" y="326" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">It checks the decision and identified findings,</text>
<text x="740" y="358" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">proposed actions, evidence, and authorization.</text>
<text x="740" y="390" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">It also inspects the recorded tool calls.</text>
<rect x="72" y="432" width="268" height="36" rx="5" fill="#e4f2ec" stroke="#e4f2ec"/>
<text x="206.0" y="456" font-size="18" fill="#287d68" font-weight="700" text-anchor="middle" letter-spacing="0">Request executed</text>
<rect x="360" y="432" width="300" height="36" rx="5" fill="#fbefdc" stroke="#fbefdc"/>
<text x="510.0" y="456" font-size="18" fill="#986323" font-weight="700" text-anchor="middle" letter-spacing="0">Or request rejected</text>
<rect x="740" y="432" width="588" height="36" rx="5" fill="#e4eef5" stroke="#e4eef5"/>
<text x="1034.0" y="456" font-size="18" fill="#286b89" font-weight="700" text-anchor="middle" letter-spacing="0">A conformity result for every gate</text>
<text x="48" y="537" font-size="14" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">ONE DOSSIER, IN ORDER</text>
<rect x="48" y="565" width="302" height="92" rx="9" fill="#fcfdfd" stroke="#c9d9e3"/>
<text x="199" y="601" font-size="21" fill="#142c40" font-weight="700" text-anchor="middle" letter-spacing="0">Gate 1 review</text>
<text x="199" y="634" font-size="18" fill="#506678" font-weight="400" text-anchor="middle" letter-spacing="0">Output + trace</text>
<path d="M353 611 H374" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="382" y="565" width="302" height="92" rx="9" fill="#fcfdfd" stroke="#c9d9e3"/>
<text x="533" y="601" font-size="21" fill="#142c40" font-weight="700" text-anchor="middle" letter-spacing="0">Following gates</text>
<text x="533" y="634" font-size="18" fill="#506678" font-weight="400" text-anchor="middle" letter-spacing="0">Actual agent outputs</text>
<path d="M687 611 H708" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="716" y="565" width="302" height="92" rx="9" fill="#fcfdfd" stroke="#c9d9e3"/>
<text x="867" y="601" font-size="21" fill="#142c40" font-weight="700" text-anchor="middle" letter-spacing="0">General gate</text>
<text x="867" y="634" font-size="18" fill="#506678" font-weight="400" text-anchor="middle" letter-spacing="0">Consolidation</text>
<path d="M1021 611 H1042" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1050" y="565" width="302" height="92" rx="9" fill="#e7f1f5" stroke="#c9d9e3"/>
<text x="1201" y="601" font-size="21" fill="#142c40" font-weight="700" text-anchor="middle" letter-spacing="0">Route scoring</text>
<text x="1201" y="634" font-size="18" fill="#506678" font-weight="400" text-anchor="middle" letter-spacing="0">Every gate evaluated</text>
<text x="48" y="703" font-size="20" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Later gates receive the agent’s actual reviews, including any errors.</text>
<text x="48" y="733" font-size="20" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">The final scorer does not rewrite these reviews before they are passed onward.</text>
<path d="M48 763 H1352" fill="none" stroke="#d5dfe6" stroke-width="1.5"/>
<text x="48" y="792" font-size="15" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Code: synthetic_environment.py → benchmark_runner.py → score_submission.py (frozen benchmark version).</text>
</g></svg>
