<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">From facts to a scored governance decision</title>
  <desc id="desc">Generated case facts produce public evidence for an agent. The agent submits a review decision, which is scored against reference outcomes derived from the same facts. The reference outcomes are evaluator-only data and are not passed to the agent.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1725"/><stop offset="1" stop-color="#142739"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#8abccc" stroke-width="1.5"/></marker>
    <marker id="gold" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#e9ba6e" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="43" fill="#8fc9d7" font-size="13" letter-spacing="3">THE EVALUATION LOOP</text>
    <text x="40" y="88" fill="#f2f5f7" font-size="31" font-weight="600">From facts to a scored decision</text>
    <text x="40" y="119" fill="#a6b8c6" font-size="16">A controlled environment for evidence, judgment, and authorization.</text>
    <g fill="#132a3b" stroke="#34566a">
      <rect x="40" y="157" width="200" height="144" rx="12"/>
      <rect x="270" y="157" width="200" height="144" rx="12"/>
      <rect x="500" y="157" width="200" height="144" rx="12"/>
      <rect x="730" y="157" width="200" height="144" rx="12"/>
      <rect x="960" y="157" width="200" height="144" rx="12" stroke="#c4995b"/>
    </g>
    <g stroke="#8abccc" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M243 229 H264"/><path d="M473 229 H494"/><path d="M703 229 H724"/><path d="M933 229 H954"/>
    </g>
    <g fill="#8fc9d7" font-size="12" letter-spacing="2">
      <text x="59" y="188">01 / GENERATE</text><text x="289" y="188">02 / OBSERVE</text><text x="519" y="188">03 / INVESTIGATE</text><text x="749" y="188">04 / SUBMIT</text>
    </g>
    <text x="979" y="188" fill="#e9ba6e" font-size="12" letter-spacing="2">05 / EVALUATE</text>
    <g fill="#f2f5f7" font-size="23" font-weight="600">
      <text x="59" y="223">Case facts</text><text x="289" y="223">Evidence</text><text x="519" y="223">Agent + tools</text><text x="749" y="223">Gate review</text><text x="979" y="223">Score</text>
    </g>
    <g fill="#bccbd5" font-size="14">
      <text x="59" y="254">Seeded project state</text><text x="59" y="278">Synthetic enterprise</text>
      <text x="289" y="254">Documents + snapshots</text><text x="289" y="278">Policy + architecture</text>
      <text x="519" y="254">Read, query, investigate</text><text x="519" y="278">Request missing evidence</text>
      <text x="749" y="254">Findings + disposition</text><text x="749" y="278">Actions + authorization</text>
      <text x="979" y="254">Strict gate success</text><text x="979" y="278">Route reliability</text>
    </g>
    <path d="M140 301 V352 H1060 V309" fill="none" stroke="#e9ba6e" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#gold)"/>
    <rect x="280" y="337" width="640" height="31" rx="15" fill="#172d3c"/>
    <text x="600" y="358" fill="#f1c788" font-size="14" text-anchor="middle">Reference outcomes from the same facts · evaluator only</text>
    <text x="600" y="399" fill="#9baebd" font-size="13" text-anchor="middle">Measures review decisions and proposed actions. Does not measure completed enterprise remediation.</text>
  </g>
</svg>
