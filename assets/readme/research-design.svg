<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="768" viewBox="0 0 1400 768" role="img" aria-labelledby="title desc">
<title id="title">A controlled comparison on shared dossiers</title><desc id="desc">An example design uses 100 Buy, 100 Integrate and 100 Build dossiers, evaluated by three models on the same case set. It schedules 900 model-case runs and 5100 gate occurrences. Counts describe the design, not completed results. Reference outcomes are evaluator-only; model availability and technical exclusions must be reported. Statistical comparisons retain the dossier as the sampling unit.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#627f90" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="1398" height="766" rx="12" fill="#fcfdfd" stroke="#d5dfe6"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="43" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="2">FIGURE 04 / EXPERIMENTAL DESIGN</text>
<text x="48" y="89" font-size="32" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">A controlled comparison on shared dossiers</text>
<text x="48" y="125" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Example configuration: 300 cases × 3 models. These are design counts, not completed results.</text>
<rect x="48" y="166" width="355" height="267" rx="9" fill="#eef4f7" stroke="#d5dfe6"/>
<text x="72" y="198" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">SHARED CASE SET</text>
<text x="72" y="238" font-size="25" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">300 synthetic dossiers</text>
<text x="72" y="279" font-size="19" fill="#142c40" font-weight="400" text-anchor="start" letter-spacing="0">100 Buy</text>
<text x="379" y="279" font-size="16" fill="#506678" font-weight="400" text-anchor="end" letter-spacing="0">6 gates / case</text>
<text x="72" y="326" font-size="19" fill="#142c40" font-weight="400" text-anchor="start" letter-spacing="0">100 Integrate</text>
<text x="379" y="326" font-size="16" fill="#506678" font-weight="400" text-anchor="end" letter-spacing="0">6 gates / case</text>
<text x="72" y="373" font-size="19" fill="#142c40" font-weight="400" text-anchor="start" letter-spacing="0">100 Build</text>
<text x="379" y="373" font-size="16" fill="#506678" font-weight="400" text-anchor="end" letter-spacing="0">5 gates / case</text>
<text x="72" y="411" font-size="16" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="0">Same cases for every model</text>
<rect x="462" y="166" width="377" height="267" rx="9" fill="#eaf3f7" stroke="#93b4c5"/>
<text x="486" y="198" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">MATCHED MODEL COMPARISON</text>
<rect x="486" y="216" width="329" height="49" rx="7" fill="#fcfdfd" stroke="#bdd1dd"/>
<text x="504" y="247" font-size="19" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Model A</text>
<text x="797" y="247" font-size="16" fill="#506678" font-weight="400" text-anchor="end" letter-spacing="0">300 cases</text>
<rect x="486" y="279" width="329" height="49" rx="7" fill="#fcfdfd" stroke="#bdd1dd"/>
<text x="504" y="310" font-size="19" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Model B</text>
<text x="797" y="310" font-size="16" fill="#506678" font-weight="400" text-anchor="end" letter-spacing="0">300 cases</text>
<rect x="486" y="342" width="329" height="49" rx="7" fill="#fcfdfd" stroke="#bdd1dd"/>
<text x="504" y="373" font-size="19" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Model C</text>
<text x="797" y="373" font-size="16" fill="#506678" font-weight="400" text-anchor="end" letter-spacing="0">300 cases</text>
<text x="486" y="411" font-size="16" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="0">Fixed prompts, tools, and scoring</text>
<rect x="898" y="166" width="454" height="267" rx="9" fill="#eef4f7" stroke="#d5dfe6"/>
<text x="922" y="198" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">TRACEABLE EVALUATION</text>
<text x="922" y="238" font-size="25" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">900 model / case runs</text>
<text x="922" y="276" font-size="20" fill="#142c40" font-weight="400" text-anchor="start" letter-spacing="0">5,100 scheduled gate occurrences</text>
<text x="922" y="321" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Decisions, findings, evidence, authority</text>
<text x="922" y="355" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Strict gate success + route success</text>
<text x="922" y="389" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Cost, availability, and exclusions</text>
<path d="M405 299 H454" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M841 299 H890" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="48" y="478" width="355" height="199" rx="9" fill="#fcfdfd" stroke="#d5dfe6"/>
<text x="72" y="508" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">01 / FREEZE</text>
<text x="72" y="542" font-size="22" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Before evaluation</text>
<text x="72" y="580" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Dataset + sampling policy</text>
<text x="72" y="612" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Prompts + model settings</text>
<text x="72" y="644" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Versioned scoring contract</text>
<rect x="462" y="478" width="377" height="199" rx="9" fill="#fcfdfd" stroke="#d5dfe6"/>
<text x="486" y="508" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">02 / COMPARE</text>
<text x="486" y="542" font-size="22" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Within shared cases</text>
<text x="486" y="580" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Report scores on common cases</text>
<text x="486" y="612" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Separate technical exclusions</text>
<text x="486" y="644" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Preserve within-case dependence</text>
<rect x="898" y="478" width="454" height="199" rx="9" fill="#fcfdfd" stroke="#d5dfe6"/>
<text x="922" y="508" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">03 / INTERPRET</text>
<text x="922" y="542" font-size="22" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Within the study boundary</text>
<text x="922" y="580" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Report uncertainty at case level</text>
<text x="922" y="612" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Validate business rules independently</text>
<text x="922" y="644" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Synthetic coverage ≠ real prevalence</text>
<path d="M48 711 H1352" fill="none" stroke="#d5dfe6" stroke-width="1.5"/>
<text x="48" y="740" font-size="15" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Counts derived from routes.py for 100 cases per main route. 900 model/case runs are not 900 independent dossiers.</text>
</g></svg>
