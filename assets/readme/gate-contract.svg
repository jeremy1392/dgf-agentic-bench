<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img" aria-labelledby="title desc">
<title id="title">The gate as an evidence and authorization contract</title><desc id="desc">An owner prepares a dossier. An agent or reviewing expert investigates evidence under a gate and phase policy, then produces findings, a disposition, proposed actions, citations and an authorization state. A scoped mandate separately governs permitted actions. REWORK can request a revised dossier. In the benchmark this is a simulated review, not proof of production execution.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#627f90" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="1398" height="748" rx="12" fill="#fcfdfd" stroke="#d5dfe6"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="43" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="2">FIGURE 02 / UNIT OF ANALYSIS</text>
<text x="48" y="89" font-size="32" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">The gate as an evidence and authorization contract</text>
<text x="48" y="125" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Each occurrence has inputs, decision rules, evidence obligations, permitted actions, and a traceable output.</text>
<rect x="445" y="162" width="907" height="86" rx="9" fill="#fbf3e7" stroke="#d8bb90"/>
<text x="468" y="192" font-size="13" fill="#a36c24" font-weight="700" text-anchor="start" letter-spacing="1">AUTHORITY / VALIDATED MANDATE</text>
<text x="468" y="224" font-size="21" fill="#142c40" font-weight="400" text-anchor="start" letter-spacing="0">Gate + phase + finding scope + conditions</text>
<text x="1330" y="224" font-size="16" fill="#506678" font-weight="400" text-anchor="end" letter-spacing="0">Permission is checked separately.</text>
<rect x="48" y="287" width="340" height="259" rx="9" fill="#eef4f7" stroke="#d5dfe6"/>
<rect x="445" y="287" width="410" height="259" rx="9" fill="#eaf3f7" stroke="#93b4c5"/>
<rect x="912" y="287" width="440" height="259" rx="9" fill="#eef4f7" stroke="#d5dfe6"/>
<text x="72" y="320" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">INPUT / DOSSIER OWNER</text>
<text x="72" y="358" font-size="23" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Versioned evidence</text>
<text x="469" y="320" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">REVIEW / AGENT OR EXPERT</text>
<text x="469" y="358" font-size="23" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Investigate and assess</text>
<text x="936" y="320" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">OUTPUT / RECORDED REVIEW</text>
<text x="936" y="358" font-size="23" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">A structured decision</text>
<text x="72" y="398" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Project facts + documents</text>
<text x="72" y="432" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Applicable policy + gate phase</text>
<text x="72" y="466" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Available upstream decisions</text>
<text x="72" y="500" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Evidence provenance</text>
<text x="469" y="398" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Read and cross-check evidence</text>
<text x="469" y="432" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Request missing information</text>
<text x="469" y="466" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Identify findings + required actions</text>
<text x="469" y="500" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Check permitted governance actions</text>
<text x="936" y="398" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Findings + evidence references</text>
<text x="936" y="432" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Disposition + proposed actions</text>
<text x="936" y="466" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Authorization state + rationale</text>
<text x="936" y="500" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Trace for scoring and handoff</text>
