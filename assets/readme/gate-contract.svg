<path d="M1132 546 V592 H216 V554" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="430" y="575" width="500" height="33" rx="4" fill="#fcfdfd" stroke="none"/>
<text x="680" y="597" font-size="16" fill="#506678" font-weight="400" text-anchor="middle" letter-spacing="0">REWORK → revise evidence and return for review</text>
<rect x="145" y="633" width="116" height="37" rx="6" fill="#eef3f5" stroke="#d5dfe6"/>
<text x="203.0" y="657" font-size="15" fill="#142c40" font-weight="400" text-anchor="middle" letter-spacing="0">GO</text>
<rect x="277" y="633" width="340" height="37" rx="6" fill="#eef3f5" stroke="#d5dfe6"/>
<text x="447.0" y="657" font-size="15" fill="#142c40" font-weight="400" text-anchor="middle" letter-spacing="0">GO_WITH_RESERVATIONS</text>
<rect x="633" y="633" width="180" height="37" rx="6" fill="#eef3f5" stroke="#d5dfe6"/>
<text x="723.0" y="657" font-size="15" fill="#142c40" font-weight="400" text-anchor="middle" letter-spacing="0">REWORK</text>
<rect x="829" y="633" width="210" height="37" rx="6" fill="#eef3f5" stroke="#d5dfe6"/>
<text x="934.0" y="657" font-size="15" fill="#142c40" font-weight="400" text-anchor="middle" letter-spacing="0">SUSPENSION</text>
<rect x="1055" y="633" width="146" height="37" rx="6" fill="#eef3f5" stroke="#d5dfe6"/>
<text x="1128.0" y="657" font-size="15" fill="#142c40" font-weight="400" text-anchor="middle" letter-spacing="0">NO_GO</text>
<path d="M48 693 H1352" fill="none" stroke="#d5dfe6" stroke-width="1.5"/>
<text x="48" y="722" font-size="15" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Concept: paper §2 and gate-contract appendix. Benchmark actions are simulated; real remediation is not assessed.</text>
</g></svg>
