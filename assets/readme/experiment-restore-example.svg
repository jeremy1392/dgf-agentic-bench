<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="756" viewBox="0 0 1400 756" role="img" aria-labelledby="title desc">
<title id="title">A backup exists. But can the data actually be restored?</title><desc id="desc">Illustrative technical readiness review, not a measured model trace: backups are enabled but no successful restore test exists. The agent should investigate, cite evidence, request a restore test and choose REWORK if other checks pass.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#627f90" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="1398" height="754" rx="12" fill="#fcfdfd" stroke="#d5dfe6"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="43" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="2">WORKED EXAMPLE / TECHNICAL READINESS</text>
<text x="48" y="89" font-size="32" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">A backup exists. But can the data actually be restored?</text>
<text x="48" y="128" font-size="20" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Illustrative scenario: backups are enabled; no successful restore test is available. Other checks pass.</text>
<rect x="48" y="181" width="414" height="268" rx="9" fill="#eef4f7" stroke="#d5dfe6"/>
<text x="70" y="216" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">1 / THE DOSSIER</text>
<text x="70" y="258" font-size="22" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">What the project presents</text>
<text x="70" y="302" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Architecture: a backup service</text>
<text x="70" y="334" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Backup record: job is enabled</text>
<text x="70" y="366" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Request: review readiness</text>
<text x="70" y="398" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">for production</text>
<rect x="493" y="181" width="414" height="268" rx="9" fill="#eef4f7" stroke="#d5dfe6"/>
<text x="515" y="216" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">2 / THE INVESTIGATION</text>
<text x="515" y="258" font-size="22" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">What the AI must verify</text>
<text x="515" y="302" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Read the supporting evidence</text>
<text x="515" y="334" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Query get_backup_job</text>
<text x="515" y="366" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Query get_restore_test</text>
<text x="515" y="398" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Check that recovery was tested</text>
<rect x="938" y="181" width="414" height="268" rx="9" fill="#eef4f7" stroke="#d5dfe6"/>
<text x="960" y="216" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">3 / THE EXPECTED REVIEW</text>
<text x="960" y="258" font-size="22" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">What a justified answer says</text>
<text x="960" y="302" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Finding: no successful restore test</text>
<text x="960" y="334" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Action: run a restore test</text>
<text x="960" y="366" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Evidence: cite the inspected record</text>
<text x="960" y="398" font-size="18" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Decision: REWORK</text>
<path d="M465 319 H486" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M910 319 H931" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="48" y="492" width="1304" height="110" rx="9" fill="#fbf3e7" stroke="#d8bb90"/>
<text x="72" y="526" font-size="13" fill="#a36c24" font-weight="700" text-anchor="start" letter-spacing="1">WHY THIS MATTERS</text>
<text x="72" y="567" font-size="21" fill="#142c40" font-weight="400" text-anchor="start" letter-spacing="0">Having a backup does not prove recovery works. A confident approval would miss the required check.</text>
<text x="48" y="645" font-size="20" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">The evaluator checks the reasoning evidence and required action, as well as the decision.</text>
<path d="M48 699 H1352" fill="none" stroke="#d5dfe6" stroke-width="1.5"/>
<text x="48" y="728" font-size="15" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Rule: evaluator.py / TR-RESTORE-001 → RUN_RESTORE_TEST → REWORK. Example only; no model result is shown.</text>
</g></svg>
