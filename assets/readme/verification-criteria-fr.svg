<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Quand une gate est-elle conforme ?</title><desc id="desc">Quand une gate est-elle conforme ?</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#627f90" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="1398" height="998" rx="12" fill="#fcfdfd" stroke="#d5dfe6"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="43" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="2">DGF-BENCH / RÈGLE DE RÉUSSITE STRICTE</text>
<text x="48" y="89" font-size="32" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Quand une gate est-elle conforme ?</text>
<text x="48" y="128" font-size="21" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Le correcteur compare le résultat de l’agent aux exigences du contrat de revue.</text>
<rect x="48" y="170" width="636" height="135" rx="9" fill="#f1f6f9" stroke="#c9d9e3"/>
<text x="72" y="207" font-size="24" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Résultat attendu</text>
<text x="72" y="245" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Faits du cas + règles applicables</text>
<text x="72" y="276" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Approbations conditionnelles validées prises en compte</text>
<path d="M366 308 V327 H700 V347" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="716" y="170" width="636" height="135" rx="9" fill="#f1f6f9" stroke="#c9d9e3"/>
<text x="740" y="207" font-size="24" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Résultat de l’agent</text>
<text x="740" y="245" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Décision, problèmes, actions, preuves, autorisation</text>
<text x="740" y="276" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Trace des sources consultées et des outils utilisés</text>
<path d="M1034 308 V327 H700 V347" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="48" y="358" width="1304" height="60" rx="6" fill="#fcfdfd" stroke="#d5dfe6"/>
<rect x="64" y="370" width="39" height="36" rx="5" fill="#e4eef5" stroke="#e4eef5"/>
<text x="83.5" y="395" font-size="18" fill="#286b89" font-weight="700" text-anchor="middle" letter-spacing="0">1</text>
<text x="121" y="396" font-size="21" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Décision</text>
<text x="360" y="396" font-size="20" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">La disposition correspond-elle au résultat attendu ?</text>
<rect x="48" y="430" width="1304" height="60" rx="6" fill="#fcfdfd" stroke="#d5dfe6"/>
<rect x="64" y="442" width="39" height="36" rx="5" fill="#e4eef5" stroke="#e4eef5"/>
<text x="83.5" y="467" font-size="18" fill="#286b89" font-weight="700" text-anchor="middle" letter-spacing="0">2</text>
<text x="121" y="468" font-size="21" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Problèmes</text>
<text x="360" y="468" font-size="20" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Tous les problèmes attendus sont présents, sans ajout incorrect.</text>
<rect x="48" y="502" width="1304" height="60" rx="6" fill="#fcfdfd" stroke="#d5dfe6"/>
<rect x="64" y="514" width="39" height="36" rx="5" fill="#e4eef5" stroke="#e4eef5"/>
<text x="83.5" y="539" font-size="18" fill="#286b89" font-weight="700" text-anchor="middle" letter-spacing="0">3</text>
<text x="121" y="540" font-size="21" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Actions proposées</text>
<text x="360" y="540" font-size="20" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Les actions proposées correspondent exactement aux actions requises.</text>
<rect x="48" y="574" width="1304" height="60" rx="6" fill="#fcfdfd" stroke="#d5dfe6"/>
<rect x="64" y="586" width="39" height="36" rx="5" fill="#e4eef5" stroke="#e4eef5"/>
<text x="83.5" y="611" font-size="18" fill="#286b89" font-weight="700" text-anchor="middle" letter-spacing="0">4</text>
<text x="121" y="612" font-size="21" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Preuves</text>
<text x="360" y="612" font-size="20" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Sources réellement consultées et extraits conformes au contrat.</text>
<rect x="48" y="646" width="1304" height="60" rx="6" fill="#fcfdfd" stroke="#d5dfe6"/>
<rect x="64" y="658" width="39" height="36" rx="5" fill="#e4eef5" stroke="#e4eef5"/>
<text x="83.5" y="683" font-size="18" fill="#286b89" font-weight="700" text-anchor="middle" letter-spacing="0">5</text>
<text x="121" y="684" font-size="21" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Autorisation</text>
<text x="360" y="684" font-size="20" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Indicateur correct ; approbation conditionnelle revalidée si utilisée.</text>
<rect x="48" y="740" width="1304" height="67" rx="9" fill="#e4f2ec" stroke="#a8cdbd"/>
<text x="700" y="782" font-size="26" fill="#287d68" font-weight="700" text-anchor="middle" letter-spacing="0">Les 5 contrôles passent → la gate réussit strictement</text>
<rect x="48" y="822" width="1304" height="55" rx="9" fill="#e4eef5" stroke="#b7cddd"/>
<text x="700" y="857" font-size="23" fill="#286b89" font-weight="700" text-anchor="middle" letter-spacing="0">Toutes les gates réussissent → le parcours complet réussit</text>
<text x="48" y="919" font-size="20" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Une décision de refus correcte peut réussir. Les réparations physiques sont hors de ce test.</text>
<path d="M48 943 H1352" fill="none" stroke="#d5dfe6" stroke-width="1.5"/>
<text x="48" y="972" font-size="15" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Code : score_submission.py et approval_policy.py. Les critères décrivent le score strict d’origine.</text>
</g></svg>
