<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="462" viewBox="0 0 1200 462" role="img" aria-labelledby="title desc">
  <title id="title">Three governance routes, eight gate families</title>
  <desc id="desc">Buy: Procurement, Legal, Compliance, Security, IT, General. Integrate: IT, Architecture, Security, Legal, Compliance, General. Build: IT, Architecture, Security, Tech Readiness, General. Gates execute sequentially within each route.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1725"/><stop offset="1" stop-color="#142739"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#7393a5" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="462" rx="22" fill="url(#bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="43" fill="#8fc9d7" font-size="13" letter-spacing="3">THE GOVERNANCE MAP</text>
    <text x="40" y="88" fill="#f2f5f7" font-size="31" font-weight="600">Three routes. Eight gate families.</text>
    <text x="40" y="119" fill="#a6b8c6" font-size="16">Sequential reviews, with structured handoffs between gates.</text>
    <g font-size="15" font-weight="600">
      <text x="40" y="191" fill="#92d0dc">BUY</text>
      <text x="40" y="287" fill="#b3bbef">INTEGRATE</text>
      <text x="40" y="383" fill="#ecc38a">BUILD</text>
    </g>
    <g stroke="#7393a5" stroke-width="1.5" marker-end="url(#arrow)" fill="none">
      <path d="M309 186 H329 M474 186 H494 M639 186 H659 M804 186 H824 M969 186 H989"/>
      <path d="M309 282 H329 M474 282 H494 M639 282 H659 M804 282 H824 M969 282 H989"/>
      <path d="M309 378 H329 M474 378 H494 M639 378 H659 M804 378 H989"/>
    </g>
    <g fill="#153041" stroke="#3a6275">
      <rect x="170" y="154" width="135" height="64" rx="10"/><rect x="335" y="154" width="135" height="64" rx="10"/><rect x="500" y="154" width="135" height="64" rx="10"/><rect x="665" y="154" width="135" height="64" rx="10"/><rect x="830" y="154" width="135" height="64" rx="10"/>
    </g>
    <g fill="#202d49" stroke="#525e8c">
      <rect x="170" y="250" width="135" height="64" rx="10"/><rect x="335" y="250" width="135" height="64" rx="10"/><rect x="500" y="250" width="135" height="64" rx="10"/><rect x="665" y="250" width="135" height="64" rx="10"/><rect x="830" y="250" width="135" height="64" rx="10"/>
    </g>
    <g fill="#332f2a" stroke="#806848">
      <rect x="170" y="346" width="135" height="64" rx="10"/><rect x="335" y="346" width="135" height="64" rx="10"/><rect x="500" y="346" width="135" height="64" rx="10"/><rect x="665" y="346" width="135" height="64" rx="10"/>
    </g>
    <g fill="#18353d" stroke="#608b8c">
      <rect x="995" y="154" width="135" height="64" rx="10"/><rect x="995" y="250" width="135" height="64" rx="10"/><rect x="995" y="346" width="135" height="64" rx="10"/>
    </g>
    <g fill="#eef3f7" font-size="16" text-anchor="middle">
      <text x="237.5" y="192">Procurement</text><text x="402.5" y="192">Legal</text><text x="567.5" y="192">Compliance</text><text x="732.5" y="192">Security</text><text x="897.5" y="192">IT</text><text x="1062.5" y="192">General</text>
      <text x="237.5" y="288">IT</text><text x="402.5" y="288">Architecture</text><text x="567.5" y="288">Security</text><text x="732.5" y="288">Legal</text><text x="897.5" y="288">Compliance</text><text x="1062.5" y="288">General</text>
      <text x="237.5" y="384">IT</text><text x="402.5" y="384">Architecture</text><text x="567.5" y="384">Security</text><text x="732.5" y="374">Tech</text><text x="732.5" y="394">Readiness</text><text x="1062.5" y="384">General</text>
    </g>
    <text x="40" y="441" fill="#9baebd" font-size="13">Example route compositions. Full-lifecycle cases can repeat gate families across project phases.</text>
  </g>
