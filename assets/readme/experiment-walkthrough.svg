<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
<title id="title">From a fictional project to a scored review</title><desc id="desc">Six steps: generate project context, architecture, and evidence; let an AI investigate; record gate decisions; score against a hidden reference. The reference reaches the evaluator only.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#627f90" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="1398" height="928" rx="12" fill="#fcfdfd" stroke="#d5dfe6"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="43" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="2">EXPERIMENT WALKTHROUGH / HOW THE TEST WORKS</text>
<text x="48" y="89" font-size="32" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">From a fictional project to a scored review</text>
<text x="48" y="128" font-size="21" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">The generator builds the case. The AI under test reviews it. The evaluator checks its work.</text>
<rect x="48" y="175" width="414" height="217" rx="9" fill="#eef4f7" stroke="#d5dfe6"/>
<text x="70" y="209" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">01 / PROJECT CONTEXT</text>
<text x="70" y="252" font-size="23" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">A business scenario</text>
<text x="70" y="294" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Buy, integrate, or build</text>
<text x="70" y="323" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Users, budget, data, owners</text>
<text x="70" y="352" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Constraints and target dates</text>
<rect x="493" y="175" width="414" height="217" rx="9" fill="#eef4f7" stroke="#d5dfe6"/>
<text x="515" y="209" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">02 / TECHNICAL DESIGN</text>
<text x="515" y="252" font-size="23" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">An architecture</text>
<text x="515" y="294" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Applications, networks, identity</text>
<text x="515" y="323" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Data stores and information flows</text>
<text x="515" y="352" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Backup and recovery design</text>
<rect x="938" y="175" width="414" height="217" rx="9" fill="#eef4f7" stroke="#d5dfe6"/>
<text x="960" y="209" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">03 / REVIEW DOSSIER</text>
<text x="960" y="252" font-size="23" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Evidence to examine</text>
<text x="960" y="294" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Project brief and review requests</text>
<text x="960" y="323" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Diagrams, contracts, test records</text>
<text x="960" y="352" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Some evidence may be incomplete</text>
<rect x="48" y="470" width="414" height="217" rx="9" fill="#eef4f7" stroke="#d5dfe6"/>
<text x="70" y="504" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">04 / AI INVESTIGATION</text>
<text x="70" y="547" font-size="23" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Read and cross-check</text>
<text x="70" y="589" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Inspect documents and diagrams*</text>
<text x="70" y="618" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Query simulated company systems</text>
<text x="70" y="647" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Resolve gaps and contradictions</text>
<rect x="493" y="470" width="414" height="217" rx="9" fill="#eef4f7" stroke="#d5dfe6"/>
<text x="515" y="504" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">05 / GATE DECISIONS</text>
<text x="515" y="547" font-size="23" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Explain and hand over</text>
<text x="515" y="589" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Findings, evidence, required actions</text>
<text x="515" y="618" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Decision and authorization checks</text>
<text x="515" y="647" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Earlier reviews inform later ones**</text>
<rect x="938" y="470" width="414" height="217" rx="9" fill="#eef4f7" stroke="#d5dfe6"/>
<text x="960" y="504" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="1">06 / EVALUATION</text>
<text x="960" y="547" font-size="23" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Compare with the reference</text>
<text x="960" y="589" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Decision, findings, actions, evidence</text>
<text x="960" y="618" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Permissions and route completion</text>
<text x="960" y="647" font-size="17" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Recorded cost and technical failures</text>
<path d="M465 280 H486" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M910 280 H931" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M465 575 H486" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M910 575 H931" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1145 395 V428 H255 V462" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="48" y="727" width="842" height="77" rx="9" fill="#fbf3e7" stroke="#d8bb90"/>
<text x="70" y="756" font-size="13" fill="#a36c24" font-weight="700" text-anchor="start" letter-spacing="1">EVALUATOR ONLY / HIDDEN REFERENCE</text>
<text x="70" y="786" font-size="20" fill="#142c40" font-weight="400" text-anchor="start" letter-spacing="0">Known case facts + expected findings, actions, and decisions</text>
<path d="M890 766 H1145 V695" fill="none" stroke="#a36c24" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="48" y="840" font-size="16" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">* Image inspection depends on the vision setting and model.  ** In agent handoff mode.</text>
<path d="M48 873 H1352" fill="none" stroke="#d5dfe6" stroke-width="1.5"/>
<text x="48" y="902" font-size="15" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Sources: facts_engine.py · generate_dgfbench_v6.py · document_factory.py · openrouter_eval/ · evaluator.py</text>
</g></svg>
