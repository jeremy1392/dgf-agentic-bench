<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">What makes a gate pass?</title><desc id="desc">What makes a gate pass?</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#627f90" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="1398" height="998" rx="12" fill="#fcfdfd" stroke="#d5dfe6"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="43" font-size="13" fill="#286b89" font-weight="700" text-anchor="start" letter-spacing="2">DGF-BENCH / STRICT SUCCESS RULE</text>
<text x="48" y="89" font-size="32" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">What makes a gate pass?</text>
<text x="48" y="128" font-size="21" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">The scorer compares the agent’s result with the requirements of the review contract.</text>
<rect x="48" y="170" width="636" height="135" rx="9" fill="#f1f6f9" stroke="#c9d9e3"/>
<text x="72" y="207" font-size="24" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Expected result</text>
<text x="72" y="245" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Case facts + applicable policy</text>
<text x="72" y="276" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Validated conditional approvals taken into account</text>
<path d="M366 308 V327 H700 V347" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="716" y="170" width="636" height="135" rx="9" fill="#f1f6f9" stroke="#c9d9e3"/>
<text x="740" y="207" font-size="24" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Agent result</text>
<text x="740" y="245" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Decision, findings, actions, evidence, authorization</text>
<text x="740" y="276" font-size="19" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Trace of observed sources and tool use</text>
<path d="M1034 308 V327 H700 V347" fill="none" stroke="#627f90" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="48" y="358" width="1304" height="60" rx="6" fill="#fcfdfd" stroke="#d5dfe6"/>
<rect x="64" y="370" width="39" height="36" rx="5" fill="#e4eef5" stroke="#e4eef5"/>
<text x="83.5" y="395" font-size="18" fill="#286b89" font-weight="700" text-anchor="middle" letter-spacing="0">1</text>
<text x="121" y="396" font-size="21" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Decision</text>
<text x="360" y="396" font-size="20" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Does the disposition match the required outcome?</text>
<rect x="48" y="430" width="1304" height="60" rx="6" fill="#fcfdfd" stroke="#d5dfe6"/>
<rect x="64" y="442" width="39" height="36" rx="5" fill="#e4eef5" stroke="#e4eef5"/>
<text x="83.5" y="467" font-size="18" fill="#286b89" font-weight="700" text-anchor="middle" letter-spacing="0">2</text>
<text x="121" y="468" font-size="21" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Findings</text>
<text x="360" y="468" font-size="20" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">All expected findings are present, with no incorrect additions.</text>
<rect x="48" y="502" width="1304" height="60" rx="6" fill="#fcfdfd" stroke="#d5dfe6"/>
<rect x="64" y="514" width="39" height="36" rx="5" fill="#e4eef5" stroke="#e4eef5"/>
<text x="83.5" y="539" font-size="18" fill="#286b89" font-weight="700" text-anchor="middle" letter-spacing="0">3</text>
<text x="121" y="540" font-size="21" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Proposed actions</text>
<text x="360" y="540" font-size="20" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">The proposed action set matches the required action set.</text>
<rect x="48" y="574" width="1304" height="60" rx="6" fill="#fcfdfd" stroke="#d5dfe6"/>
<rect x="64" y="586" width="39" height="36" rx="5" fill="#e4eef5" stroke="#e4eef5"/>
<text x="83.5" y="611" font-size="18" fill="#286b89" font-weight="700" text-anchor="middle" letter-spacing="0">4</text>
<text x="121" y="612" font-size="21" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Evidence</text>
<text x="360" y="612" font-size="20" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Sources were actually observed; excerpts meet the evidence contract.</text>
<rect x="48" y="646" width="1304" height="60" rx="6" fill="#fcfdfd" stroke="#d5dfe6"/>
<rect x="64" y="658" width="39" height="36" rx="5" fill="#e4eef5" stroke="#e4eef5"/>
<text x="83.5" y="683" font-size="18" fill="#286b89" font-weight="700" text-anchor="middle" letter-spacing="0">5</text>
<text x="121" y="684" font-size="21" fill="#142c40" font-weight="700" text-anchor="start" letter-spacing="0">Authorization</text>
<text x="360" y="684" font-size="20" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Correct indicator; conditional approval revalidated when used.</text>
<rect x="48" y="740" width="1304" height="67" rx="9" fill="#e4f2ec" stroke="#a8cdbd"/>
<text x="700" y="782" font-size="26" fill="#287d68" font-weight="700" text-anchor="middle" letter-spacing="0">All 5 checks pass → strict gate success</text>
<rect x="48" y="822" width="1304" height="55" rx="9" fill="#e4eef5" stroke="#b7cddd"/>
<text x="700" y="857" font-size="23" fill="#286b89" font-weight="700" text-anchor="middle" letter-spacing="0">Every gate passes → complete-route success</text>
<text x="48" y="919" font-size="20" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">A correct refusal can pass. Performing the physical remediation is outside this test.</text>
<path d="M48 943 H1352" fill="none" stroke="#d5dfe6" stroke-width="1.5"/>
<text x="48" y="972" font-size="15" fill="#506678" font-weight="400" text-anchor="start" letter-spacing="0">Code: score_submission.py and approval_policy.py. Criteria describe the original strict score.</text>
</g></svg>
